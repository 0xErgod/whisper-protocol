name: release

# Runs semantic-release on every push to `main` (and prerelease branches).
# Each package decides independently whether to release based on the
# scope of the conventional-commit messages since its last tag:
#
#   feat(sdk): …                  → SDK gets a minor bump
#   fix(sdk): …                   → SDK gets a patch bump
#   feat(sdk)!: …                 → SDK gets a major bump
#   feat(wallet-derived-keys): …  → wallet-derived-keys gets a minor bump
#   feat: …                       → no release (unscoped commits don't release)
#   chore / ci / test / docs: …   → no release
#
# Authentication uses npm's OIDC trusted-publishing flow — no NPM_TOKEN
# secret. The workflow's GitHub-issued OIDC JWT is exchanged at npm for
# a short-lived publish credential, gated by a per-package
# trusted-publisher record on npmjs.com that pins (org, repo, workflow
# filename). Renaming this file or moving the release job into a
# reusable workflow will break publishing — update the npm-side
# trusted-publisher records first if you do.
#
# Provenance signing is automatic with OIDC; npm derives the Sigstore
# attestation from the same id-token, so consumers see a green
# "Provenance" badge on npmjs.com.

on:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

permissions:
  # semantic-release/git pushes the version-bump commit + the tag,
  # semantic-release/github creates the GitHub release.
  contents: write
  issues: write
  pull-requests: write
  # OIDC: lets the runner request the JWT that proves
  # `(repo, workflow)` matches the trusted-publisher record on npm.
  # Required for both publish auth and provenance signing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Matrix one job per package so failures isolate per-package and
    # logs are easier to scan. Each job runs semantic-release for one
    # package only, scoped via its own .releaserc.json + tagFormat.
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: "@whisper-protocol/sdk"
            dir: packages/sdk
          - name: "@whisper-protocol/wallet-derived-keys"
            dir: packages/wallet-derived-keys

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs full history to walk commits since the
          # last tag and decide the next version.
          fetch-depth: 0
          # Use a token that can push back to main (commit + tag). The
          # default GITHUB_TOKEN works because we set `contents: write`
          # above, and main isn't protected (yet — see README).
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      # OIDC publish needs npm 11.5.1+. Notes on getting there:
      #
      # - Node 22's toolcache image (22.22.2) ships a broken bundled
      #   npm@10 — `npm install -g npm@latest` fails with
      #   MODULE_NOT_FOUND for promise-retry (actions/runner-images
      #   #13883). We can't use Node 22.
      # - corepack with `prepare npm@11.5.1 --activate` doesn't take
      #   precedence over the toolcache npm on PATH (`npm --version`
      #   stays at 10.9.7 on the next step).
      # - Node 20 ships a working bundled npm@10 that CAN run
      #   `npm install -g npm@11.5.1`. That's the only path that
      #   actually swaps the npm on PATH.
      #
      # IMPORTANT: do NOT pass `registry-url` to setup-node.
      # setup-node's registry-url writes a project-local .npmrc with
      # `${NODE_AUTH_TOKEN}` placeholder, which shadows
      # @semantic-release/npm's OIDC-set token at publish time and
      # produces ENEEDAUTH. semantic-release configures the registry
      # itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install OIDC-capable npm
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build target package
        run: pnpm --filter "${{ matrix.package.name }}" run build

      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN, no NODE_AUTH_TOKEN — both would shadow the
          # OIDC handshake. @semantic-release/npm@13.1+ does the OIDC
          # token-exchange itself given id-token:write at the job
          # level, then writes the resulting short-lived token into
          # npm's runtime config before invoking `npm publish`.
        working-directory: ${{ matrix.package.dir }}
        run: pnpm exec semantic-release

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    name: typecheck + build (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Don't pass `version:` here — package.json's "packageManager" field
      # already pins pnpm@8.15.8, and pnpm/action-setup@v4 errors out if
      # both are specified.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Block PRs that hand-edit packages/sdk/src/networks.ts out of
      # sync with the canonical networks.json. The generator's --check
      # mode exits non-zero when the on-disk file would differ from
      # what it'd write, with a clear "run pnpm gen:networks" message.
      - name: networks.ts drift check
        run: pnpm --filter "@whisper-protocol/sdk" run gen:networks:check

      - name: typecheck packages
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: typecheck web
        run: pnpm --filter whisper-web run typecheck

      - name: build web
        run: pnpm --filter whisper-web run build

  rust:
    name: rust cli check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      # `-D warnings` promotes any clippy lint to an error. The Rust
      # CLI is small; if a lint fires that's worth ignoring, prefer
      # `#[allow(...)]` at the offending site over relaxing this gate.
      - run: cargo clippy --all-targets -- -D warnings

  move:
    name: move package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install sui cli
        env:
          # Authenticated GitHub API calls get 5000 req/hour vs 60 for
          # anonymous; without the token a busy fork/PR day across the
          # repo could blow through the limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pull the latest mainnet release tarball at runtime so we don't
          # have to bump a version pin every couple weeks.
          tag=$(curl -sL --fail \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MystenLabs/sui/releases?per_page=30" \
            | grep '"tag_name":' \
            | grep -oE 'mainnet-v[0-9.]+' \
            | head -1)
          if [ -z "$tag" ]; then
            echo "::error::could not resolve latest sui mainnet release tag"
            exit 1
          fi
          echo "Using sui release: $tag"
          curl -L --fail -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/$tag/sui-$tag-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.local/bin"
          # Archive entries are prefixed with `./` (e.g. `./sui`), so we
          # need the matching path or we get "Not found in archive".
          tar -xzf sui.tgz -C "$HOME/.local/bin" ./sui
          chmod +x "$HOME/.local/bin/sui"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: sui --version
      - run: sui move build --path contracts
